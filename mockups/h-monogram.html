<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup H · Monogram</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--ink:#10162b;--mut:#5a627c;--blue:#2a45a0;--tint:#e9edf8}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:400 18px/1.55 'Hanken Grotesk',sans-serif;overflow-x:hidden}
.bar{display:flex;justify-content:space-between;padding:24px 48px;position:relative;z-index:2}.bar b{font:400 24px 'Newsreader',serif}.bar span{color:var(--mut)}
.hero{position:relative;min-height:760px;padding:0 48px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:56px;overflow:hidden}
.mono{position:absolute;right:4vw;top:-2vw;font:300 46vw/.8 'Newsreader',serif;color:var(--tint);letter-spacing:-.08em;user-select:none}
.hero>*:not(.mono){position:relative}
.hero img.bill{position:absolute;right:6%;top:18%;width:34%;transform:rotate(-6deg);animation:f 7s ease-in-out infinite alternate}@keyframes f{to{transform:rotate(-2deg) translateY(-16px)}}
h1{font:300 clamp(80px,12vw,200px)/.88 'Newsreader',serif;letter-spacing:-.045em;margin:0}
.hero p{font-size:21px;max-width:40ch;color:var(--mut);margin:20px 0 0}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0 48px 56px}.row div{padding:24px 24px 24px 0}.row b{display:block;font:300 64px/1 'Newsreader',serif;color:var(--blue)}.row span{color:var(--mut)}
</style></head><body><div class="bar"><b>Javohir Ikromov</b><span>Numbers · Story · Program · Work · Vault</span></div>
<section class="hero"><div class="mono">J</div><img class="bill" src="../public/vault/bill.jpg" alt=""><h1>Javohir<br>Ikromov</h1><p>Finance applicant. Founder of Finaris. One of 1,500 students chosen nationwide from about 30,000.</p></section>
<div class="row"><div><b>1,310</b><span>SAT</span></div><div><b>7.0</b><span>IELTS</span></div><div><b>1,500</b><span>chosen nationwide</span></div><div><b>+20.2%</b><span>mentoring gain</span></div></div></body></html>
