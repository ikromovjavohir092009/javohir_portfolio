<style>
:root{--ink:#161a22;--mut:#5d6472;--blue:#2d4ba0}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:400 18px/1.55 'Hanken Grotesk',sans-serif;overflow-x:hidden}
.bar{display:flex;justify-content:space-between;padding:24px 48px}.bar b{font:400 24px 'Newsreader',serif}.bar span{color:var(--mut)}
